name: Build Plugin
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Find pom.xml and Build with Maven
      run: |
        # Automatically locate the folder containing pom.xml and run maven there
        POM_DIR=$(dirname $(find . -name "pom.xml" -not -path "*/.*"))
        echo "Found pom.xml in directory: $POM_DIR"
        cd "$POM_DIR"
        mvn clean package
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DonutSMPCore-Jar
        path: "**/target/*.jar"
